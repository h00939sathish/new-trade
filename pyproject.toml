[project]
name = "trading-system"
version = "0.1.0"
description = "Multi-agent institutional-grade trading system"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "asyncpg>=0.29",
    "aiokafka>=0.10",
    "redis[hiredis]>=5.0",
    "httpx>=0.27",
    "websocket-client>=1.8",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyotp>=2.9",
    "jugaad-data>=0.3",
    "rich>=13.0",
]



[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
kite = [
    "kiteconnect>=5.0",
]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "torch>=2.3",
]
streaming = [
    "apache-flink>=1.19",
]
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
