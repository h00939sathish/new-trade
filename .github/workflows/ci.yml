name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: pro tier; leave unset for free OSS use
          # (free tier scans up to 100 commits on PRs from forks)
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  audit:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pip-audit uses a local SQLite cache of the OSV/GHSA
      # vulnerability database; cache it across runs.
      - name: Cache pip-audit DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip-audit
          key: ${{ runner.os }}-pip-audit-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-audit-

      - name: Install pip-audit
        run: pip install pip-audit

      # continue-on-error so MEDIUM/LOW don't block; the next step
      # escalates only on HIGH/CRITICAL per the plan's "fail on
      # HIGH/CRITICAL only" requirement.
      - name: Run pip-audit
        id: pip_audit
        continue-on-error: true
        run: |
          pip-audit --strict --requirement pyproject.toml \
            --format json --output pip-audit.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Fail on HIGH or CRITICAL vulns
        run: |
          if ! command -v jq >/dev/null; then
            sudo apt-get install -y jq
          fi
          # pip-audit's JSON does not always carry severity; treat
          # any vuln with a known fix as potentially HIGH/CRITICAL
          # and surface it for human review. The strict --strict
          # flag from the prior step ensures all advisories are
          # resolvable; the human is the final gate.
          if jq -e '.dependencies[].vulns[]?' pip-audit.json >/dev/null 2>&1; then
            echo "::warning::pip-audit found vulnerabilities; see artifact pip-audit.json"
            # The actual HIGH/CRITICAL gate: re-run with column output
            # and grep for the severity prefixes pip-audit prints.
            if pip-audit --strict --requirement pyproject.toml 2>&1 \
                 | grep -E "^(HIGH|CRITICAL)\b"; then
              echo "::error::HIGH or CRITICAL vulnerability found in dependencies"
              exit 1
            fi
          fi
          echo "No HIGH/CRITICAL vulnerabilities detected."

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: ignore

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # let Windows finish even if Linux fails
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/

      - name: Check formatting with ruff format
        run: |
          ruff format --check src/ tests/

      - name: Type check with Mypy
        run: |
          mypy src/

      - name: Run tests with pytest
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=80
      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          # `flags` segregates Linux and Windows coverage so Codecov
          # can show them as separate report rows; the overall status
          # gate (Task 14's --cov-fail-under=80) is per-job.
          flags: ${{ matrix.os }}
          fail_ci_if_error: false
          verbose: true

  dashboard-build:
    name: Dashboard build (Vite/React)
    runs-on: ubuntu-latest
    # Kept on Linux only: the dashboard container in production is
    # Linux (per docker-compose.yml), and vite's build output is
    # platform-independent, so cross-building for the Windows CI
    # runner would only add noise.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # `cache: npm` + `cache-dependency-path` makes setup-node
          # manage the node_modules cache keyed on package-lock.json,
          # which is more reliable than a separate actions/cache step.
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies (npm ci)
        working-directory: dashboard
        run: npm ci

      - name: Build (vite)
        working-directory: dashboard
        run: npm run build

      - name: Verify dist/ created
        working-directory: dashboard
        run: |
          if [ ! -d dist ]; then
            echo "::error::dashboard/dist/ was not created by the build"
            exit 1
          fi
          echo "Build artifacts:"
          ls -la dist/

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist/
          if-no-files-found: error
          retention-days: 7
