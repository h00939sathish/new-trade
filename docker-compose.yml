services:
  postgres:
    image: timescale/timescaledb:2-pg16
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_alerts.yml:/etc/prometheus/prometheus_alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=timescaledb
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  trading-app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TRA_HTTP_AUTH_TOKEN: "${TRA_HTTP_AUTH_TOKEN:?TRA_HTTP_AUTH_TOKEN must be set (generate with: openssl rand -hex 32)}"
      TRA_EVENT_STORE_TYPE: postgres
      TRA_POSTGRES_DSN: postgresql+asyncpg://trading:trading@postgres:5432/trading
      TRA_REDIS_URL: redis://redis:6379/0
      TRA_LOG_LEVEL: INFO
      TRA_GROWW_API_KEY: ${TRA_GROWW_API_KEY}
      TRA_GROWW_API_SECRET: ${TRA_GROWW_API_SECRET}
      TRA_GROWW_TOTP_SECRET: ${TRA_GROWW_TOTP_SECRET}
      TRA_GROWW_AUTH_TOKEN: ${TRA_GROWW_AUTH_TOKEN}
      TRA_KITE_API_KEY: ${TRA_KITE_API_KEY}
      TRA_KITE_ACCESS_TOKEN: ${TRA_KITE_ACCESS_TOKEN}
      TRA_WATCHLIST: ${TRA_WATCHLIST:-RELIANCE,TCS,INFY,HDFCBANK}
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
